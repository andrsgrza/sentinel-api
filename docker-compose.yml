services:
  postgres:
    image: postgres:16
    container_name: sentinel-postgres

    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_password

    ports:
      - "5432:5432"

    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data

volumes:
  sentinel_postgres_data:
